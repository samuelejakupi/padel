name: Pubblica Padel House su GitHub Pages

on:
  # Vercel e ora l'hosting di produzione. Pages resta disponibile soltanto
  # come fallback manuale e non parte piu a ogni push su main.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Le pubblicazioni restano in fila e non si annullano a metà: interrompere una
# consegna già avviata lascia l'ambiente occupato da un deployment fantasma, e
# quello dopo aspetta invano finché non scade. È anche ciò che GitHub consiglia
# per Pages.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configura il percorso del sito
        shell: bash
        run: |
          if [[ "${{ github.event.repository.name }}" == *.github.io ]]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=https://${{ github.repository_owner }}.github.io" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_BASE_PATH=/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
          fi
      - name: Crea il sito
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Il lavoro non resta appeso all'infinito se Pages non risponde affatto.
    timeout-minutes: 30
    steps:
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Dieci minuti è il massimo consentito: valori più alti vengono
          # riportati d'ufficio a questo. Restano il controllo diradato e la
          # maggior tolleranza agli errori temporanei dell'API.
          timeout: 600000
          reporting_interval: 10000
          error_count: 20
